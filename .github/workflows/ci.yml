# CI gate macro: CI gate covering the full quality bar:
# build / test / clippy-deny / fmt / supply-chain audit.
#
# `cargo audit` runs against `Cargo.lock` and fails if any direct or
# transitive dependency has a CVE in the RustSec advisory database.
# That gives us a formal supply-chain check at every push and PR;
# `Cargo.lock` is committed so the audit is reproducible.
#
# All third-party actions are pinned to a 40-char commit SHA, not a
# floating tag. `@v4` would let an attacker who compromises the action
# repo (or the publisher's npm/PAT) silently re-tag a malicious commit
# and reach our workflow's GITHUB_TOKEN — the tj-actions/changed-files
# class of supply-chain attack. The `# vX.Y.Z` trailing comment records
# what the SHA was when pinned so reviewers don't have to look it up;
# Dependabot updates both the SHA and the comment together
# (see `.github/dependabot.yml` — github-actions ecosystem).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Daily 04:17 UTC sweep — catches CVEs disclosed AFTER the last
    # commit. The commit-triggered runs above only see CVEs known at
    # commit time.
    - cron: "17 4 * * *"

# Minimal top-level permissions — satisfy OpenSSF Scorecard TokenPermissions.
# Individual jobs that need write access declare it explicitly below.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Cancel superseded runs on the same ref (rapid pushes to a PR) so we don't
# burn runners on stale commits or race the required-check status.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build · test · clippy · fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable (HEAD as of 2026-03-27)
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny tier + warnings)
        # `-D warnings` is the point (audit #272). The `[lints.clippy]`
        # block in Cargo.toml declares `unwrap_used`, `expect_used`,
        # `panic`, `todo` and `await_holding_lock` as deny, and surfaces
        # pedantic + nursery as warnings — but without this flag those
        # warnings printed and CI exited zero, so the entire curated
        # pedantic/nursery configuration was decorative. In particular
        # `cognitive_complexity` (nursery) fired on exactly the functions
        # it was enabled for and blocked nothing.
        #
        # The tree is clean at this level, so there is no backlog to work
        # through: a new warning means a new regression.
        # `--all-targets` covers tests + examples + benches.
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (debug)
        run: cargo build --all-targets

      - name: Test
        run: cargo test --all-targets

      - name: Build (release, stripped)
        run: cargo build --release

  lint-scripts:
    name: Lint shell + Python
    runs-on: ubuntu-latest
    # Audit #274: 10 shell files and 2 Python files shipped unchecked.
    # One of them (scripts/repin-cloudimg.py) rewrites Rust source in
    # place and opens supply-chain-sensitive re-pin PRs on a schedule;
    # the live harnesses under tests/live/ decide what a mutation test
    # asserts against a real cluster, where an unquoted expansion changes
    # the answer silently.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: ruff (Python)
        uses: astral-sh/ruff-action@0c50076f12c38c3d0115b7b519b54a91cb9cf0ad  # v3.5.1

      - name: shellcheck
        # `-S error` only: the tree currently carries style and warning
        # findings (SC2155, SC2086 …) that are real but not worth
        # blocking a release over today. Tighten to `-S warning` once
        # they are cleared — the point of starting at `error` is that the
        # gate is green and therefore trusted, rather than red and
        # routinely ignored.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S error tests/live/*.sh scripts/*.sh

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    # Audit #274. GitHub's native secret scanning covers provider
    # patterns on push; this covers the rest, and covers history — which
    # matters here specifically: tests/live/test_mutation.sh records that
    # an earlier revision of that script committed a real PVE token to
    # public git history (rotated and revoked when discovered).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # gitleaks scans history, not just the tree

      - name: gitleaks
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    # Audit #275: nothing measured which code the ~1250 tests execute, so
    # the distribution of that effort was chosen by judgement and could
    # not be checked. Deliberately NO threshold: the value is the
    # per-file view of which modules the suite never enters, which is the
    # input needed to decide where the next test belongs. A threshold set
    # below current reality would never bite, and one set above it would
    # block unrelated work.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable (HEAD as of 2026-03-27)
        with:
          components: llvm-tools-preview

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: coverage

      - name: Install cargo-llvm-cov
        run: cargo install --locked --version 0.9.1 cargo-llvm-cov

      - name: Measure
        run: cargo llvm-cov --all-targets --lcov --output-path lcov.info

      - name: Summary
        run: cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-lcov
          path: lcov.info

  audit:
    name: Supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable (HEAD as of 2026-03-27)

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          # Don't share with build-test cache — we only need the
          # registry, not target/.
          shared-key: audit

      - name: Install cargo-audit
        # Audit #280 — pinned. `--locked` fixes the tool's own transitive
        # dependencies but not WHICH version of the tool is installed, so
        # the code deciding whether the build passes its security gate
        # changed on every run without review. `cross` and `cargo-deb` in
        # release.yml were already pinned; the tools with the most
        # authority were the ones left floating. Dependabot's cargo
        # cadence carries the bumps as reviewable PRs.
        run: cargo install --locked --version 0.22.2 cargo-audit

      - name: Audit Cargo.lock for CVEs
        # The `--deny warnings` flag escalates yanked-crate notices
        # into hard failures alongside actual CVEs. Adjust if it
        # becomes too noisy for legitimate reasons (then keep just
        # `cargo audit`).
        run: cargo audit --deny warnings

  deny:
    name: Supply-chain policy (cargo-deny)
    runs-on: ubuntu-latest
    # Companion to `audit:` above. `cargo audit` covers CVE advisories
    # against the RustSec DB; `cargo deny` additionally enforces:
    #   - License whitelist (MIT/Apache-2.0/BSD/ISC/MPL-2.0 + curated
    #     exceptions). Blocks GPL / AGPL / SSPL transitively.
    #   - Banned crates (openssl / native-tls — rustls-only posture).
    #   - Source locking (crates.io only — no git deps).
    #   - Wildcard-version detection (refuses `version = "*"`).
    #   - Multiple-major-version drift (warn-only).
    #
    # Config lives in `deny.toml` at repo root; every ignore/exception
    # is documented with the dep path + why-accepted + remediation.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable (HEAD as of 2026-03-27)

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: deny

      - name: Install cargo-deny
        run: cargo install --locked --version 0.20.2 cargo-deny

      - name: Check supply-chain policy (advisories + licenses + bans + sources)
        run: cargo deny check

  musl-static:
    name: Static binary (musl)
    runs-on: ubuntu-latest
    # Macro audit: `x86_64-unknown-linux-musl` produces
    # a TRULY portable Linux binary that links libc statically. The
    # default `x86_64-unknown-linux-gnu` glibc binary built on Ubuntu
    # 24.04 (`GLIBC_2.39`) crashes on Debian 11 (`GLIBC_2.31`) /
    # Alpine (musl) with `symbol lookup error`. The musl artefact
    # runs on every Linux distro from RHEL 6 to Alpine 3.20.
    #
    # We don't run tests on musl — the library code is identical, the
    # only delta is the link target.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain + musl target
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable (HEAD as of 2026-03-27)
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: musl

      - name: Build static release
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Verify the binary is statically linked
        # `ldd` on a static binary prints "not a dynamic executable"
        # OR "statically linked" depending on libc; either is the
        # correct outcome — we fail only if it lists shared deps.
        run: |
          set -e
          BIN=target/x86_64-unknown-linux-musl/release/proxxx
          file "$BIN"
          if ldd "$BIN" 2>&1 | grep -q "=>"; then
            echo "ERROR: musl binary still has dynamic deps"
            ldd "$BIN"
            exit 1
          fi
          echo "OK: $BIN is statically linked"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: proxxx-x86_64-linux-musl
          path: target/x86_64-unknown-linux-musl/release/proxxx
          retention-days: 14
