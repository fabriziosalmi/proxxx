# Mutation testing (#297) — cargo-mutants over the three modules whose
# tests stand behind a refusal: the HITL approval gate (src/hitl), the
# HMAC audit chain (src/audit) and the incident freeze (src/incident).
# Scope, tests and exclusions live in .cargo/mutants.toml.
#
# Scheduled, not a PR gate: a run takes hours and every survivor needs
# judgement. The summary job lists the survivors and their count, so
# the count can be followed run to run in the job summaries. A survivor
# is either killed by a new assertion or excluded in mutants.toml with
# the reason it is not meaningful.
#
# Actions are pinned to a commit SHA (see ci.yml); cargo-mutants by
# version.

name: Mutants

on:
  schedule:
    - cron: "41 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutants:
    name: Mutants (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable (HEAD as of 2026-03-27)
        with:
          toolchain: stable

      - name: Install cargo-mutants
        run: cargo install --locked --version 27.1.0 cargo-mutants

      - name: Run shard ${{ matrix.shard }}
        # Exit 2 means survivors were found: that is the report, not a
        # failure of the job. Anything else non-zero is a real failure
        # (baseline tests failing, a crash).
        run: |
          set +e
          cargo mutants --shard "${{ matrix.shard }}/8" -j 2 --no-shuffle -o mutants-shard
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ] && [ "$code" -ne 3 ]; then
            exit "$code"
          fi

      - name: Upload the outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: |
            mutants-shard/mutants.out/*.txt
            mutants-shard/mutants.out/outcomes.json
          retention-days: 90

  summary:
    name: Survivors
    needs: mutants
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download the outcomes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: mutants-shard-*
          path: shards

      - name: Write the job summary
        run: |
          count() { cat shards/*/"$1".txt 2>/dev/null | sort -u | grep -c . || true; }
          missed=$(count missed)
          {
            echo "## Mutation testing: src/hitl, src/audit, src/incident"
            echo
            echo "| Outcome | Mutants |"
            echo "|---|---|"
            for o in caught missed timeout unviable; do
              echo "| $o | $(count "$o") |"
            done
            echo
            echo "### Survivors ($missed)"
            echo
            if [ "$missed" -eq 0 ]; then
              echo "None."
            else
              echo '```'
              cat shards/*/missed.txt | sort -u
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
